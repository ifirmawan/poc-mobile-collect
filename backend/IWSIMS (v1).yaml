      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          pattern: ^.*$
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
  /api/v1/organisations:
    get:
      operationId: v1_organisations_list
      summary: Get list of organisation
      parameters:
      - in: query
        name: attributes
        schema:
          type: number
      - in: query
        name: id
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Organisation
      security:

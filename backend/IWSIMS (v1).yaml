      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleOption'
          description: ''
  /api/v1/user:
    post:
      operationId: v1_user_create
      description: Role Choice are SuperAdmin:1,Admin:2
      summary: To add user
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
  /api/v1/invitation/{invitation_id}:
    get:
      operationId: v1_invitation_retrieve

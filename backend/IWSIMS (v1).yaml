      summary: Get list of organisations for webform options
      parameters:
      - in: query
        name: attribute
        schema:
          type: number
          enum:
          - 1
          - 2
        required: true
      - in: path
        name: selected_id
        schema:
          type: number
        description: ID of the selected organization (optional)
        required: true
      tags:
      - Organisation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationAttributeChildren'
          description: ''
  /api/v1/organisation/{organisation_id}:

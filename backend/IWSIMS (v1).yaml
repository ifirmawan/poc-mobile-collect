openapi: 3.0.3
info:
  title: IWSIMS
  version: 1.0.0 (v1)
paths:
  /api/v1/levels:
    get:
      operationId: v1_levels_list
      summary: Get list of levels
      tags:
      - Administration
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListLevel'
          description: ''
  /api/v1/administration/{administration_id}:
    get:
      operationId: v1_administration_retrieve
      summary: Get list of administration
      parameters:
      - in: path
        name: administration_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: filter
        schema:
          type: number
      - in: query
        name: filter_children
        schema:
          type: array
          items:
            type: number
      - in: query
        name: max_level
        schema:
          type: number
      tags:
      - Administration
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdministration'
          description: ''
  /api/v1/profile:
    get:
      operationId: v1_profile_retrieve
      summary: Get user details from token
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/login:
    post:
      operationId: v1_login_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
  /api/v1/users:
    get:
      operationId: v1_users_retrieve
      summary: Get list of users
      parameters:
      - in: query
        name: administration
        schema:
          type: number
      - in: query
        name: organisation
        schema:
          type: number
      - in: query
        name: page
        schema:
          type: number
        required: true
      - in: query
        name: pending
        schema:
          type: boolean
      - in: query
        name: role
        schema:
          type: number
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: trained
        schema:
          type: boolean
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: ''
  /api/v1/user/{user_id}:
    get:
      operationId: v1_user_retrieve
      summary: To get user details
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
    put:
      operationId: v1_user_update
      description: Role Choice are SuperAdmin:1,Admin:2,User:4
      summary: To update user
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddEditUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
    delete:
      operationId: v1_user_destroy
      summary: To delete user
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - User
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deletion with no response
  /api/v1/user/forgot-password:
    post:
      operationId: v1_user_forgot_password_create
      summary: To send reset password instructions
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
          description: ''
  /api/v1/user/set-password:
    put:
      operationId: v1_user_set_password_update
      summary: To set user's password
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetUserPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/user/roles:
    get:
      operationId: v1_user_roles_list
      summary: Get list of roles
      tags:
      - User
      security:
      - jwtAuth: []
